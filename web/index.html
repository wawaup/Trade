<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tradebot 实时交易监控</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <nav class="top-page-nav" aria-label="主视图切换">
        <button class="active" type="button" data-page-target="backtestPage">策略历史回测</button>
        <button type="button" data-page-target="livePage">当前实盘交易</button>
      </nav>
      <div>
        <span class="eyebrow">Tradebot · Binance Stock Token Desk</span>
        <h1>交易阶段监控台</h1>
      </div>
      <div class="status-strip">
        <span id="connectionStatus">连接中</span>
        <span id="updatedAt">--</span>
      </div>
    </header>

    <main class="workspace">
      <section class="panel page active" id="backtestPage" aria-labelledby="backtestTitle">
        <div class="section-head">
          <div>
            <span class="eyebrow">Research</span>
            <h2 id="backtestTitle">策略历史回测</h2>
          </div>
          <div class="segmented">
            <button class="active" type="button">多标的</button>
            <button type="button">参数高原</button>
            <button type="button">压力测试</button>
          </div>
        </div>
        <div class="metric-grid" id="backtestSummary"></div>
        <div class="split-grid">
          <div class="table-wrap">
            <h3>多标的横向测试</h3>
            <table>
              <thead>
                <tr>
                  <th>标的</th>
                  <th>板块</th>
                  <th>收益</th>
                  <th>最大回撤</th>
                  <th>胜率</th>
                  <th>交易</th>
                </tr>
              </thead>
              <tbody id="assetRows"></tbody>
            </table>
          </div>
          <div class="chart-panel">
            <h3>参数敏感度</h3>
            <div id="sensitivityBars" class="bars"></div>
            <h3>压力测试</h3>
            <div id="stressList" class="stress-list"></div>
          </div>
        </div>
      </section>

      <section class="panel page" id="livePage" aria-labelledby="liveTitle">
        <div class="section-head">
          <div>
            <span class="eyebrow">Trading</span>
            <h2 id="liveTitle">当前实盘交易</h2>
          </div>
          <div class="mode-pill" id="tradeMode">模拟监控</div>
        </div>
        <div class="split-grid live-grid">
          <div class="table-wrap">
            <h3>实时持仓与风控</h3>
            <table>
              <thead>
                <tr>
                  <th>标的</th>
                  <th>状态</th>
                  <th>最新价</th>
                  <th>T层数</th>
                  <th>总预算</th>
                  <th>T预算</th>
                  <th>点差</th>
                  <th>风险</th>
                </tr>
              </thead>
              <tbody id="liveRows"></tbody>
            </table>
          </div>
          <div>
            <section class="allocation-panel">
              <h3>仓位分配设置</h3>
              <form id="allocationForm">
                <label class="field">
                  <span>币安总账户金额 USDT/USDC</span>
                  <input id="totalAccountQuote" name="totalAccountQuote" type="number" min="1" step="100">
                </label>
                <div id="allocationRows" class="allocation-rows"></div>
                <button class="save-button" type="submit">保存仓位比例</button>
                <p id="allocationMessage" class="form-message"></p>
              </form>
            </section>
            <h3>保护规则</h3>
            <ul id="guardrails" class="guardrails"></ul>
            <h3>Terminal 风格执行 Log</h3>
            <pre id="terminalLog" class="terminal"></pre>
          </div>
        </div>
      </section>
    </main>

    <aside class="knowledge-card" id="knowledgeCard" aria-label="金融概念说明">
      <button class="knowledge-toggle" type="button" id="knowledgeToggle">金融概念逐字说明</button>
      <div class="knowledge-body">
        <div id="glossary"></div>
      </div>
    </aside>
  </div>
  <script src="./app.js"></script>
</body>
</html>
