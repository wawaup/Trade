services:
  tradebot-dashboard:
    build: .
    container_name: tradebot-dashboard
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      # persist backtest results across restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
